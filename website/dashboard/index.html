<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dopamine Dashboard - Select Server</title>
    <link rel="icon" type="image/ico" href="../favico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/toast.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-noise"></div>

    <div class="dash-wrapper">
        <div class="dash-header">
            <div class="dash-title">
                <h1>Server Selection</h1>
                <p>Select a server to manage with Dopamine</p>
            </div>
            <div style="display: flex; align-items: center; gap: 16px;">
                <div id="userBadge" class="user-badge">
                    <span>Loading user...</span>
                </div>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </div>

        <div id="guildGrid" class="guild-grid">
            <div style="grid-column: 1 / -1; text-align: center; color: var(--text-secondary); padding: 40px;">
                Loading your Discord servers...
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/guild.js"></script>
    <script src="js/pages/selector.js"></script>
</body>
</html>
